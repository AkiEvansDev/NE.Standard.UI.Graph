# Runs in the public mirror of the graph. The framework arrives as a package here, so this also proves
# that the version the component is built against is really on the feed.
name: Build

on:
  # Branches only: a sync pushes the tag too, and an unfiltered push would build the same commit twice.
  push:
    branches:
      - '**'
  pull_request:
  # Where the owner starts a run by hand.
  workflow_dispatch:

permissions:
  contents: read

# A push while a run waits or builds replaces it: only the newest run is worth having.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A sync commit lands minutes before nuget.org carries what this tree pins, and a slice released beside this
      # one may publish later still - so a sync waits here for every pinned version first. The wait belongs in the
      # mirror rather than in Release: a public repository's minutes cost nothing, a private one's are billed.
      - name: Wait for the pinned packages on the feed
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Sync ') }}
        run: |
          grep -rhoE --exclude-dir=.git 'PackageReference Include="NE\.[^"]+" Version="\$\([A-Za-z]+\)"' . \
            | sed -E 's/.*Include="([^"]+)" Version="\$\(([A-Za-z]+)\)"/\1 \2/' \
            | sort -u \
            | while read -r id property; do
                echo "$id $(sed -n "s:.*<$property>\(.*\)</$property>.*:\1:p" Directory.Build.props | head -1)"
              done > "$RUNNER_TEMP/pins"

          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            missing=""
            while read -r id version; do
              feed="https://api.nuget.org/v3-flatcontainer/$(echo "$id" | tr '[:upper:]' '[:lower:]')/index.json"
              curl -sf "$feed" | grep -q "\"$version\"" || missing="$missing $id/$version"
            done < "$RUNNER_TEMP/pins"
            [ -z "$missing" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Not on nuget.org after thirty minutes:$missing"
              exit 1
            fi
            echo "Waiting for:$missing"
            sleep 30
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The canvas engine and the stylesheet build from the TypeScript client as part of `dotnet build`.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Restore
        run: dotnet restore

      # `EnforceCodeStyleInBuild` and `TreatWarningsAsErrors` are set for every project in the repository's
      # Directory.Build.props, so IDE0055 - formatting, down to trailing whitespace and the final newline -
      # fails this step. A separate `dotnet format --verify-no-changes` reloads the whole solution through
      # Roslyn and re-analyses it from scratch: about three times the cost of the build, to find the same
      # things a second time.
      - name: Build
        run: dotnet build --no-restore --configuration Release
