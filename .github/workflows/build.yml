# Runs in every public mirror, the framework's and each package's, copied there as its build.yml by sync.sh. Tests live in the
# private repository and are not mirrored, so this proves that the sources compile and are formatted - and that what builds
# against the published packages (a demo; a package against the framework) restores them. That second half is the useful
# one: it is a real test of what is on the feed.
name: Build

on:
  # Branches only: a sync pushes the tag too, and an unfiltered push would build the same commit twice.
  push:
    branches:
      - '**'
  pull_request:
  # Where the owner starts a run by hand.
  workflow_dispatch:

permissions:
  contents: read

# A push while a run waits or builds replaces it: only the newest run is worth having.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # A TypeScript client or a generated stylesheet builds as part of `dotnet build`, so node has to be here before restore.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      # A sync commit lands minutes before nuget.org carries what this tree restores, and the feed indexes a release's packages
      # one by one - a pinned package can be there before one it depends on - so on a sync the restore itself is what waits,
      # tried again until the whole graph resolves. No HTTP cache, or a version missing on the first try stays missing. The
      # wait belongs in the mirror rather than in Release: a public repository's minutes cost nothing, a private one's are billed.
      - name: Restore
        env:
          SYNC: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Sync ') }}
        run: |
          if [ "$SYNC" != "true" ]; then
            dotnet restore
            exit
          fi

          deadline=$(( $(date +%s) + 1800 ))
          until dotnet restore --no-http-cache; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::The packages this tree pins did not all resolve on nuget.org within thirty minutes."
              exit 1
            fi
            echo "Not everything is on the feed yet; restoring again in 30 s."
            sleep 30
          done

      # `EnforceCodeStyleInBuild` and `TreatWarningsAsErrors` are set for every project in the repository's
      # Directory.Build.props, so IDE0055 - formatting, down to trailing whitespace and the final newline -
      # fails this step. A separate `dotnet format --verify-no-changes` reloads the whole solution through
      # Roslyn and re-analyses it from scratch: about three times the cost of the build, to find the same
      # things a second time.
      - name: Build
        run: dotnet build --no-restore --configuration Release
